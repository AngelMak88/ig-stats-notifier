name: Daily IG stats to Telegram

on:
  schedule:
    # 06:07 UTC ≈ 09:07 Greece time (EEST, summer). Deliberately NOT on the
    # hour (06:00) — round-hour crons are the most popular slot on GitHub
    # Actions and queue up behind everyone else's, which is why the first
    # two runs landed ~2h late (07:57-07:58 UTC instead of 06:00). GitHub's
    # own guidance is to pick an off-peak minute to avoid that queueing.
    # During Greek winter time (EET, UTC+2) this fires at 08:07 local
    # instead of 09:07 — see README.md for how to shift it after the DST
    # change in late October.
    - cron: "7 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run notifier
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USERNAMES: ${{ vars.IG_USERNAMES }}
        run: python notifier.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.new.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.new.json state.json
            git add state.json
            git diff --cached --quiet && exit 0
            git commit -m "Update state.json [skip ci]"
            git push && exit 0
            echo "Push rejected (attempt $i) — retrying against latest remote"
            sleep $((i * 2))
          done
          echo "::error::Failed to push state.json after 5 attempts"
          exit 1
