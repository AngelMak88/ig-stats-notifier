name: Daily IG stats to Telegram

on:
  # GitHub's own `schedule:` trigger was dropped (2026-08-20) — even after
  # moving off the round-hour slot (06:07 UTC instead of 06:00) to dodge
  # queueing, runs still landed ~2h late (08:07 UTC instead of 06:07, twice
  # in a row). This looks like general GitHub Actions schedule-trigger
  # unreliability on low-activity/private repos, not something fixable by
  # picking a different minute. Timing is now driven externally: a
  # cron-job.org job POSTs to this workflow's `workflow_dispatch` REST
  # endpoint at the exact desired time every day. See README.md for the
  # external cron setup.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run notifier
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USERNAMES: ${{ vars.IG_USERNAMES }}
        run: python notifier.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.new.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.new.json state.json
            git add state.json
            git diff --cached --quiet && exit 0
            git commit -m "Update state.json [skip ci]"
            git push && exit 0
            echo "Push rejected (attempt $i) — retrying against latest remote"
            sleep $((i * 2))
          done
          echo "::error::Failed to push state.json after 5 attempts"
          exit 1
